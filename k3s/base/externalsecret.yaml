# Expected Vault KV v2 layout at `kv/apps/censai/censai/env`:
#
#   DATABASE_URL:                  "postgresql+psycopg://censai:<pw>@<host>:5432/<db>"
#   DB_SCHEMA:                     "censai"
#   CENSAI_CENTRAL_DB_ENABLED:     "true"
#   CENSAI_USE_LLM_GATEWAY:        "true"
#   LLM_GATEWAY_URL:               "http://llmgateway.llmgateway.svc.cluster.local:8000"
#   LLM_GATEWAY_API_KEY:           "<gateway key>"
#   LLM_GATEWAY_CHAT_PATH:         "/api/chat"
#   LLM_GATEWAY_VISION_MODEL:      "gemma4:27b"
#   LLM_GATEWAY_PROFANITY_MODEL:   "gemma4:27b"
#
# Postgres and LLMGateway are not run by this chart. If DATABASE_URL is omitted
# or blank, CensAI falls back to root-level SQLite via CENSAI_MAIN_SQLITE_PATH.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: censai-env
  namespace: censai
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: censai-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/censai/censai/env
