apiVersion: apps/v1
kind: Deployment
metadata:
  name: censai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: censai
  template:
    metadata:
      labels:
        app: censai
    spec:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: ghcr.io/krishnarajt/censai:git-57c225da78e2e795a974af705720c70eb810fb75
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: censai-env
          volumeMounts:
            - name: media-shows-1
              mountPath: /media-shows-1
            - name: media-shows-2
              mountPath: /media-shows-2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: media-shows-1
          hostPath:
            path: /media/krishnaraj/media/media/shows
            type: Directory
        - name: media-shows-2
          hostPath:
            path: /media/krishnaraj/media2/media/shows
            type: Directory
