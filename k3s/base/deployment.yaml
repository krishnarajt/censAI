apiVersion: apps/v1
kind: Deployment
metadata:
  name: censai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: censai
  template:
    metadata:
      labels:
        app: censai
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: ghcr.io/krishnarajt/censai:git-d9d758f5194cfd3048778005521d831ffc49f741
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: censai-env
          env:
            - name: CENSAI_MEDIA_FOLDER
              value: /media
            - name: CENSAI_MAIN_SQLITE_PATH
              value: /app/censai.sqlite3
            - name: CENSAI_UI_HOST
              value: 0.0.0.0
            - name: CENSAI_UI_PORT
              value: "8000"
            - name: CENSAI_AUTO_PROCESS_DUE
              value: "true"
            - name: CENSAI_RETRY_DELAY_HOURS
              value: "24"
            - name: CENSAI_LLM_GATEWAY_MAX_PARALLEL_CALLS
              value: "3"
          volumeMounts:
            - name: media
              mountPath: /media
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: censai-media
